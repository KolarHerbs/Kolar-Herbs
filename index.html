<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kolar Herbs Guide</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f2; color: #2d3e2d; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; border-top: 10px solid #4a7c44; overflow: hidden; }
        .header { padding: 20px; text-align: center; background: #f9fff8; }
        h1 { color: #4a7c44; margin: 10px 0; }
        .stats { display: flex; justify-content: space-around; padding: 15px; border-bottom: 1px solid #eee; font-weight: bold; }
        .content { padding: 20px; line-height: 1.6; }
        .fact { background: #edf3ec; padding: 15px; border-radius: 10px; font-style: italic; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <small>KOLAR HERBS NURSERY</small>
            <h1 id="name">Welcome!</h1>
        </div>
        <div class="stats">
            <div>☀️ <span id="sun">--</span></div>
            <div>💧 <span id="water">--</span></div>
        </div>
        <div class="content">
            <p id="fact" class="fact">Scan a plant QR code to see details!</p>
        </div>
        <script>
        const plantData = {
            'stevia': { fact: "Stevia leaves are up to 300 times sweeter than sugar with zero calories!", sun: "Full Sun", water: "Medium", type: "Perennial" },
            'ajwain': { fact: "Commonly used in Indian cooking to aid digestion and add a thyme-like flavor.", sun: "Full/Partial", water: "Low", type: "Annual" },
            'asafoetida': { n: 'Asafoetida (Hing)', s: 'Full Sun', w: 'Low', f: 'A giant fennel species known for its savory resin.' },
            'rudraksha': { n: 'Rudraksha', s: 'Full Sun', w: 'Medium', f: 'Sacred tree; the seeds are used for prayer beads.' },
            'giloy': { n: 'Giloy / Guduchi', s: 'Full Sun', w: 'Medium', f: 'The "Amrita" herb, famous for boosting immunity.' },
            
            // NEW COFFEE PLANT SECTION (Matches Apple Tag format)
            'coffee': {
                'title': 'Fruiting Plant | Coffea arabica',
                'commonName': 'Coffee Plant',
                'description': 'Description: A compact evergreen shrub with glossy, dark green leaves. Produces fragrant white flowers in spring, followed by bright red "cherries" containing two coffee beans. A vigorous and beautiful indoor or patio plant that can produce your own home-grown coffee.',
                'sunValue': 'Indirect Sun / Partial Shade',
                'waterValue': 'Moderate to High',
                'soilValue': 'Well-Drained',
                'heightValue': '1.5M to 2M',
                'isDetailed': true
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id')?.toLowerCase();
        
        if (id && plantData[id]) {
            const data = plantData[id];

            // Handle standard plants (like Stevia/Giloy)
            if (!data.isDetailed) {
                document.getElementById('plant-name').innerText = data.n || id.charAt(0).toUpperCase() + id.slice(1);
                document.getElementById('fact-box').innerText = data.f || data.fact;
                document.getElementById('sun-val').innerText = data.s || data.sun;
                document.getElementById('water-val').innerText = data.w || data.water;
                document.getElementById('type-val').innerText = data.type || "Perennial";
            } 
            // Handle new detailed "Coffee Tag" plants
            else {
                document.getElementById('plant-name').innerText = data.commonName;
                document.getElementById('type-val').innerText = data.title; // Show full scientific name here
                document.getElementById('fact-box').innerHTML = `<strong>${data.description}</strong>`;
                document.getElementById('sun-val').innerText = data.sunValue;
                document.getElementById('water-val').innerText = data.waterValue;
                
                // Add new Soil and Height stats dynamically
                const contentArea = document.querySelector('.content');
                const extraStats = document.createElement('div');
                extraStats.classList.add('stats-row');
                extraStats.style.borderTop = '1px solid #eee';
                extraStats.innerHTML = `
                    <div class="stat"><span class="stat-icon">🪴</span><span class="stat-label">Soil</span><span class="stat-value">${data.soilValue}</span></div>
                    <div class="stat"><span class="stat-icon">📏</span><span class="stat-label">Height</span><span class="stat-value">${data.heightValue}</span></div>
                `;
                document.querySelector('.card').insertBefore(extraStats, contentArea);
            }
        }
    </script>
</body>
</html>
